# staging 백엔드: namespace, 이미지 태그, Spring 프로파일 변경
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
images:
  - name: nginxinc/nginx-unprivileged
    newTag: 1.27-alpine
patches:
  - target:
      kind: ConfigMap
      name: backend-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: staging
