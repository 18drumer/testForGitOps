apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  # replicas 는 일부러 적지 않음!
  # → Pod 수는 HPA 가 관리. 여기 적으면 Argo CD 가 HPA 가 늘린 수를 계속 되돌림.
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # testForK8s 저장소의 GitHub Actions 가 Docker Hub 에 올리는 Spring Boot 이미지.
          # 배포할 태그(sha-xxxxxxx)는 overlay 의 images 항목에서 지정.
          image: start31/for_k8s_test
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            # DB 계정은 CloudNativePG 가 만든 Secret 에서 가져옴 (Git 에 비밀번호 없음)
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pg-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-app
                  key: password
          resources:
            requests:          # HPA 는 이 requests 기준으로 CPU 사용률(%)을 계산 → 필수
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # 앱 기동 후 warm-up(60초) 동안 /startupProbe 는 500 응답.
          # 10초 x 12회 = 최대 120초까지 기다림. 통과 전에는 readiness/liveness 를 검사하지 않음.
          startupProbe:
            httpGet:
              path: /startupProbe
              port: http
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 20
