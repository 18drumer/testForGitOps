# Kafka 웹 관리 UI (Kafbat UI, 구 Kafka UI) → namespace: kafka-ui
# dev 와 staging 의 Kafka 클러스터를 단일 UI 대시보드에서 통합 관리
# 외부 접속: https://kafka.rio.dpdns.org
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafbat-ui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/18drumer/testForGitOps.git   # ← 본인 저장소로 변경
    targetRevision: main
    path: platform/kafbat-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka-ui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
