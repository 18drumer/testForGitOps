# 로그 수집기: Grafana Alloy (Helm chart 1.13.0, Alloy v1.20) → namespace: monitoring
# DaemonSet 으로 노드마다 1 개 → 자기 노드의 /var/log/pods/* 를 읽어 Loki 로 전송 (Promtail 후속)
# 라벨: namespace / pod / container / app / node → Grafana Explore 에서 {namespace="dev", app="backend"} 처럼 조회
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: op-alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.13.0
    helm:
      releaseName: alloy
      valuesObject:
        controller:
          type: daemonset
          tolerations:                # 컨트롤 플레인 노드의 Pod 로그도 수집
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        alloy:
          mounts:
            varlog: true              # 호스트 /var/log (→ /var/log/pods) 마운트
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          configMap:
            content: |
              // 이 노드(HOSTNAME = spec.nodeName, 차트가 주입)에 떠 있는 Pod 만 찾기
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("HOSTNAME")
                }
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
                  regex         = "^;*([^;]+)(;.*)?$"
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
                // 로그 파일 경로: /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1/*.log"
                }
              }

              local.file_match "pods" {
                path_targets = discovery.relabel.pods.output
              }

              loki.source.file "pods" {
                targets    = local.file_match.pods.targets
                forward_to = [loki.process.pods.receiver]
              }

              loki.process "pods" {
                stage.cri {}                  // containerd 로그 포맷(시간 stream 플래그 본문) 파싱
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
